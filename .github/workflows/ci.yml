name: Go Examples CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            echo "Please run 'gofmt -w .' to fix formatting."
            exit 1
          fi
      
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      
      - name: Run golangci-lint
        run: |
          golangci-lint run ./...
  
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
      
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Run staticcheck
        run: staticcheck ./...
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Check test files exist
        run: |
          missing_tests=0
          for d in examples/*/; do
            if [ -f "${d}main.go" ]; then
              if ! ls "${d}"*_test.go 1> /dev/null 2>&1; then
                echo "Warning: No tests found in ${d}"
                missing_tests=1
              fi
            fi
          done
          if [ $missing_tests -eq 1 ]; then
            echo "Some examples are missing tests. Please add tests for all examples."
            exit 1
          fi
      
      - name: Run tests
        run: go run main.go
      
      - name: Run tests with coverage
        run: go run main.go -c
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage/
          verbose: true 
